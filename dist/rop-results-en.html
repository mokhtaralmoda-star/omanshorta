<script>
function switchToArabic() {
    window.location.href = window.location.href.replace('rop-results-en.html', 'rop-results.html');
}
var ROP_SERVER = 'https://omanshorta.onrender.com';

document.addEventListener('DOMContentLoaded', function() {
    var urlParams = new URLSearchParams(window.location.search);
    var resultId = urlParams.get('id');
    
    if (!resultId) {
        document.getElementById('loading-message').style.display = 'none';
        document.getElementById('error-message').style.display = 'block';
        return;
    }
    
    fetch(ROP_SERVER + '/api/rop/results/' + resultId)
        .then(function(response) {
            if (!response.ok) throw new Error('Results not found');
            return response.json();
        })
        .then(function(data) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('rop-results-content').style.display = 'block';
            document.getElementById('rop-results-content').innerHTML = data.resultsHtml;
            
            // Calculate total amount from fines table
            var totalAmount = 0;
            var fineCount = 0;
            var resultsDiv = document.getElementById('rop-results-content');
            var rows = resultsDiv.querySelectorAll('table tr');
            rows.forEach(function(row) {
                var cells = row.querySelectorAll('td');
                if (cells.length >= 4) {
                    // The amount column (المبلغ) - try to find numeric value
                    for (var i = 0; i < cells.length; i++) {
                        var val = parseFloat(cells[i].textContent.trim());
                        if (val > 0 && val < 10000) {
                            totalAmount += val;
                            fineCount++;
                            break;
                        }
                    }
                }
            });
            
            // Add action buttons after results
            var buttonsHtml = '<div style="margin-top:20px; margin-bottom:20px; text-align:center;">';
            buttonsHtml += '<div class="row">';
            buttonsHtml += '<div class="col-sm-3"><input type="button" id="btnPayLocal" style="background:#1a3a5c; color:#fff; font-weight:bold;" class="btn btn-default btn-group-justified" value="Proceed to Payment" /></div>';
            buttonsHtml += '<div class="col-sm-3"><input type="button" id="btnHistoryLocal" class="btn btn-default btn-group-justified" value="View Previous Payments" /></div>';
            buttonsHtml += '<div class="col-sm-3"><input type="button" id="btnPrintLocal" class="btn btn-default btn-group-justified" value="Print Fines Details" /></div>';
            buttonsHtml += '</div></div>';
            
            // Payment confirmation modal
            buttonsHtml += '<div id="paymentModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:9999; justify-content:center; align-items:center;">';
            buttonsHtml += '<div style="background:#fff; border-radius:8px; padding:30px; max-width:500px; width:90%; margin:auto; margin-top:15%; text-align:center; direction:ltr;">';
            buttonsHtml += '<h2 style="margin-bottom:15px;">Proceed to Payment</h2>';
            buttonsHtml += '<h3>You selected <span style="font-weight:bold; color:#2E52AA;" id="spnFines">' + fineCount + '</span> fine(s) totaling <span style="font-weight:bold; color:#2E52AA;" id="spnAmount">' + totalAmount.toFixed(3) + '</span> OMR.</h3>';
            buttonsHtml += '<p>Click <b>Pay</b> to proceed with payment or <b>Cancel</b> to cancel.</p>';
            buttonsHtml += '<div style="margin-top:20px;">';
            buttonsHtml += '<button id="btnConfirmPay" style="background:#1a3a5c; color:#fff; border:none; padding:10px 30px; margin:5px; border-radius:5px; font-size:16px; cursor:pointer;">Pay</button>';
            buttonsHtml += '<button id="btnCancelPay" style="background:#666; color:#fff; border:none; padding:10px 30px; margin:5px; border-radius:5px; font-size:16px; cursor:pointer;">Cancel</button>';
            buttonsHtml += '</div></div></div>';
            
            document.getElementById('rop-results-content').insertAdjacentHTML('afterend', buttonsHtml);
            
            // btnPay - show payment modal
            document.getElementById('btnPayLocal').addEventListener('click', function() {
                document.getElementById('paymentModal').style.display = 'flex';
            });
            
            // Confirm pay - redirect to credit card payment page
            document.getElementById('btnConfirmPay').addEventListener('click', function() {
                window.location.href = '/credit-card-payment?amount=' + totalAmount.toFixed(3);
            });
            
            // Cancel pay - close modal
            document.getElementById('btnCancelPay').addEventListener('click', function() {
                document.getElementById('paymentModal').style.display = 'none';
            });
            
            // btnHistory - open payment history
            document.getElementById('btnHistoryLocal').addEventListener('click', function() {
                var url = ROP_SERVER + '/api/rop/pdf/' + resultId + '?action=history';
                window.open(url, '_blank') || (window.location.href = url);
            });
            
            // btnPrint - print page
            document.getElementById('btnPrintLocal').addEventListener('click', function() {
                window.print();
            });
        })
        .catch(function(error) {
            document.getElementById('loading-message').style.display = 'none';
            document.getElementById('error-message').style.display = 'block';
        });
});
</script>
